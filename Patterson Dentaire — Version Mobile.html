<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patterson Dentaire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#f5f5f5;color:#1a1a1a;font-size:15px}
.hdr{background:#fff;border-bottom:1px solid #e8e8e8;padding:12px 16px;display:flex;align-items:center;gap:10;position:sticky;top:0;z-index:10}
.hdr-title{font-weight:600;font-size:15px;flex:1}
.hdr-btn{background:none;border:none;cursor:pointer;color:#185FA5;font-size:13px;padding:5px 8px;border-radius:6px;display:flex;align-items:center;gap:4px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #ebebeb}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.btn-primary{background:#E6F1FB;color:#185FA5;border:1px solid #185FA5;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer;width:100%}
input,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;font-size:14px;background:#fff;color:#1a1a1a;margin-bottom:10px}
.fab{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:#185FA5;color:#fff;border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:100;box-shadow:0 4px 12px rgba(24,95,165,0.3)}
.chat-bubble{border-radius:14px;padding:9px 13px;font-size:13px;line-height:1.6;max-width:88%;white-space:pre-wrap}
.screen{display:none;padding:14px;padding-bottom:80px}
.screen.active{display:block}
#screen-login{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:24px}
.sup-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sup-card{background:#fff;border:1px solid #ebebeb;border-radius:10px;padding:11px;cursor:pointer}
.doc-row{background:#fff;border:1px solid #ebebeb;border-radius:8px;padding:9px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-box{background:#f5f5f5;border-radius:8px;padding:10px 12px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div style="text-align:center;margin-bottom:28px">
    <div style="width:52px;height:52px;border-radius:14px;background:#E6F1FB;display:flex;align-items:center;justify-content:center;margin:0 auto 10px">
      <span style="font-size:26px">🦷</span>
    </div>
    <div style="font-weight:600;font-size:17px">Patterson Dentaire</div>
    <div style="font-size:12px;color:#888;margin-top:3px">Registre de documentation technique</div>
  </div>
  <div class="card">
    <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">Adresse courriel</label>
    <input id="inp-email" type="email" placeholder="prenom.nom@pattersondentaire.ca">
    <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">Mot de passe</label>
    <input id="inp-pwd" type="password" placeholder="••••••••" style="margin-bottom:0">
    <div id="login-err" style="color:#A32D2D;font-size:12px;margin:8px 0;display:none"></div>
    <button class="btn-primary" style="margin-top:12px" onclick="doLogin()">Se connecter</button>
  </div>
  <div style="text-align:center;font-size:11px;color:#aaa;margin-top:14px">Accès réservé aux employés Patterson</div>
</div>

<!-- DASHBOARD -->
<div id="screen-dash" class="screen">
  <div class="hdr">
    <span>🦷</span>
    <span class="hdr-title" style="margin-left:8px">Patterson Dentaire</span>
    <button class="hdr-btn" onclick="doLogout()">⬆ Quitter</button>
  </div>
  <div style="padding:14px;padding-bottom:80px">
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px">
      <div class="stat-box"><div style="font-size:10px;color:#888">Fournisseurs</div><div style="font-size:22px;font-weight:600" id="st-sup">0</div></div>
      <div class="stat-box"><div style="font-size:10px;color:#888">Documents</div><div style="font-size:22px;font-weight:600" id="st-doc">0</div></div>
    </div>
    <div style="font-weight:600;font-size:14px;margin-bottom:10px">Fournisseurs</div>
    <div class="sup-grid" id="sup-grid"></div>
  </div>
</div>

<!-- SUPPLIER DETAIL -->
<div id="screen-sup" class="screen">
  <div class="hdr">
    <button class="hdr-btn" onclick="showDash()" style="color:#888">← Retour</button>
    <span class="hdr-title" id="sup-title"></span>
    <button class="hdr-btn" onclick="showAddDoc()">+ Doc</button>
  </div>
  <div style="padding:14px;padding-bottom:80px">
    <div class="card" id="sup-info" style="margin-bottom:12px"></div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button onclick="setTab('docs')" id="tab-docs" style="flex:1;padding:7px;border-radius:7px;border:1px solid #ddd;background:#f0f0f0;font-size:13px;cursor:pointer;font-weight:500">Documents</button>
      <button onclick="setTab('stats')" id="tab-stats" style="flex:1;padding:7px;border-radius:7px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer">Stats</button>
    </div>
    <div id="tab-content-docs"></div>
    <div id="tab-content-stats" style="display:none"></div>
  </div>
</div>

<!-- SEARCH -->
<div id="screen-search" class="screen">
  <div class="hdr">
    <button class="hdr-btn" onclick="showDash()" style="color:#888">← Retour</button>
    <span class="hdr-title">Recherche</span>
  </div>
  <div style="padding:14px;padding-bottom:80px">
    <input id="search-inp" type="text" placeholder="Titre, référence, fournisseur…" oninput="doSearch()" style="margin-bottom:8px">
    <div id="search-count" style="font-size:11px;color:#888;margin-bottom:10px"></div>
    <div id="search-results"></div>
  </div>
</div>

<!-- AGENT PANEL -->
<div id="agent-panel" style="display:none;position:fixed;bottom:76px;right:14px;width:310px;height:400px;background:#fff;border-radius:14px;border:1px solid #ddd;flex-direction:column;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,0.13)">
  <div style="padding:10px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px;background:#f8f8f8;border-radius:14px 14px 0 0">
    <div style="width:28px;height:28px;border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:15px">🤖</div>
    <div style="font-weight:500;font-size:13px">Assistant technique <span style="color:#3B6D11;font-size:10px">● En ligne</span></div>
  </div>
  <div id="chat-msgs" style="flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px"></div>
  <div style="padding:8px 10px;border-top:1px solid #eee;display:flex;gap:6px">
    <input id="chat-inp" type="text" placeholder="Ex: manuel Statim 2000…" style="margin:0;padding:7px 10px;font-size:13px" onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()" style="padding:7px 12px;border-radius:8px;border:1px solid #185FA5;background:#E6F1FB;color:#185FA5;cursor:pointer;font-size:14px">➤</button>
  </div>
</div>

<button class="fab" id="fab-btn" onclick="toggleAgent()">🤖</button>
<!-- Nav bar -->
<div id="nav-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;z-index:98">
  <button onclick="showDash()" style="flex:1;padding:12px 0;background:none;border:none;font-size:11px;color:#185FA5;cursor:pointer">🏠 Accueil</button>
  <button onclick="showSearch()" style="flex:1;padding:12px 0;background:none;border:none;font-size:11px;color:#185FA5;cursor:pointer">🔍 Recherche</button>
</div>

<!-- ADD DOC MODAL -->
<div id="modal-doc" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:20px;width:90%;max-width:340px">
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <span style="font-weight:600;font-size:15px">Ajouter un document</span>
      <button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#888">✕</button>
    </div>
    <label style="font-size:12px;color:#888;display:block;margin-bottom:3px">Titre *</label>
    <input id="nd-title" placeholder="Titre du document">
    <label style="font-size:12px;color:#888;display:block;margin-bottom:3px">Type</label>
    <select id="nd-type" style="margin-bottom:10px">
      <option>Manuel</option><option>Catalogue</option><option>Schéma</option><option>Bulletin</option><option>Installation</option>
    </select>
    <label style="font-size:12px;color:#888;display:block;margin-bottom:3px">Référence</label>
    <input id="nd-ref" placeholder="ex: MOD-001">
    <label style="font-size:12px;color:#888;display:block;margin-bottom:3px">Statut</label>
    <select id="nd-status" style="margin-bottom:14px">
      <option>Vérifié</option><option>En révision</option><option>Obsolète</option>
    </select>
    <div style="display:flex;gap:8px">
      <button onclick="closeModal()" style="flex:1;padding:9px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px">Annuler</button>
      <button onclick="saveDoc()" style="flex:1;padding:9px;border-radius:8px;border:1px solid #185FA5;background:#E6F1FB;color:#185FA5;cursor:pointer;font-size:13px;font-weight:500">Ajouter</button>
    </div>
  </div>
</div>

  {id:20,name:"Tuttnauer",logo:"TT",color:"#993C1D",bg:"#FAECE7",cat:"Stérilisation",docs:[
    {id:2001,t:"Field Service Guide",type:"Manuel",ref:"TUT-FSG",s:"Vérifié"}
  ]},
  {id:21,name:"RPI",logo:"RP",color:"#533AB7",bg:"#EEEDFE",cat:"Pièces génériques",docs:[
    {id:2101,t:"RPI Dental Section",type:"Catalogue",ref:"RPI-DENT",s:"Vérifié"},
    {id:2102,t:"RPI Catalog 2020",type:"Catalogue",ref:"RPI-2020",s:"Vérifié"}
  ]},
  {id:22,name:"Velopex",logo:"VP",color:"#854F0B",bg:"#FAEEDA",cat:"Imagerie",docs:[
    {id:2201,t:"Extra-X MK6 Technical Manual",type:"Manuel",ref:"EXX-MK6",s:"En révision"},
    {id:2202,t:"Intra-X MK6 Technical Manual",type:"Manuel",ref:"INX-MK6",s:"En révision"}
  ]},
  {id:23,name:"Morita",logo:"MR",color:"#185FA5",bg:"#E6F1FB",cat:"Pièces à main",docs:[
    {id:2301,t:"LUBRINA 2 Parts List",type:"Catalogue",ref:"LUB2-PL",s:"Vérifié"},
    {id:2302,t:"LUBRINA Parts List",type:"Catalogue",ref:"LUB-PL",s:"Vérifié"}
  ]},
  {id:24,name:"Star Dental",logo:"ST",color:"#0F6E56",bg:"#E1F5EE",cat:"Pièces à main",docs:[
    {id:2401,t:"Blis-sonic Scalers",type:"Manuel",ref:"BLIS-SC",s:"En révision"},
    {id:2402,t:"Titan Motor Manual",type:"Manuel",ref:"TIT-MOT",s:"En révision"}
  ]}
];

var currentUser=null, currentSup=null, chatHistory=[], agentOpen=false;

function sc(s){return{Vérifié:{bg:"#EAF3DE",c:"#3B6D11"},"En révision":{bg:"#FAEEDA",c:"#854F0B"},Obsolète:{bg:"#FCEBEB",c:"#A32D2D"}}[s]||{bg:"#f0f0f0",c:"#666"};}

function show(id){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  var nb=document.getElementById('nav-bar');
  nb.style.display=(id==='login')?'none':'flex';
  var fab=document.getElementById('fab-btn');
  fab.style.display=(id==='login')?'none':'flex';
}

function doLogin(){
  var e=document.getElementById('inp-email').value.toLowerCase().trim();
  var p=document.getElementById('inp-pwd').value;
  var err=document.getElementById('login-err');
  if(!e.endsWith('@pattersondentaire.ca')&&!e.endsWith('@pattersoncompanies.com')){
    err.textContent='Courriel non autorisé.';err.style.display='block';return;
  }
  if(p!=='tech'){err.textContent='Mot de passe incorrect.';err.style.display='block';return;}
  err.style.display='none';
  var n=e.split('@')[0].split(/[._]/).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');
  currentUser={email:e,name:n};
  showDash();
  initChat();
}

function doLogout(){currentUser=null;show('login');}

function showDash(){
  show('dash');
  var allD=SUPS.reduce(function(a,s){return a+s.docs.length;},0);
  document.getElementById('st-sup').textContent=SUPS.length;
  document.getElementById('st-doc').textContent=allD;
  var g=document.getElementById('sup-grid');
  g.innerHTML=SUPS.map(function(s){
    return '<div class="sup-card" onclick="showSup('+s.id+')" style="border-left:3px solid '+s.color+'">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+
      '<div style="width:28px;height:28px;border-radius:6px;background:'+s.bg+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:'+s.color+'">'+s.logo+'</div>'+
      '<div style="min-width:0"><div style="font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+s.name+'</div>'+
      '<div style="font-size:9px;color:#888">'+s.cat+'</div></div></div>'+
      '<div style="font-size:10px;color:#888">📄 '+s.docs.length+' docs</div></div>';
  }).join('');
}

function showSup(id){
  currentSup=SUPS.find(function(s){return s.id===id;});
  if(!currentSup)return;
  document.getElementById('sup-title').textContent=currentSup.name;
  document.getElementById('sup-info').innerHTML=
    '<div style="display:flex;align-items:center;gap:10px">'+
    '<div style="width:36px;height:36px;border-radius:8px;background:'+currentSup.bg+';display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:'+currentSup.color+'">'+currentSup.logo+'</div>'+
    '<div><div style="font-weight:600;font-size:15px">'+currentSup.name+'</div><div style="font-size:11px;color:#888">'+currentSup.cat+' · '+currentSup.docs.length+' documents</div></div></div>';
  setTab('docs');
  show('sup');
}

function setTab(t){
  document.getElementById('tab-docs').style.background=t==='docs'?'#f0f0f0':'#fff';
  document.getElementById('tab-stats').style.background=t==='stats'?'#f0f0f0':'#fff';
  document.getElementById('tab-content-docs').style.display=t==='docs'?'block':'none';
  document.getElementById('tab-content-stats').style.display=t==='stats'?'block':'none';
  if(t==='docs') renderDocs();
  else renderStats();
}

function renderDocs(){
  var el=document.getElementById('tab-content-docs');
  if(!currentSup||currentSup.docs.length===0){el.innerHTML='<div style="text-align:center;padding:24px;color:#888">Aucun document</div>';return;}
  el.innerHTML=currentSup.docs.map(function(d){
    var ss=sc(d.s);
    return '<div class="doc-row">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-weight:500;font-size:13px">'+d.t+'</div>'+
      '<div style="font-size:10px;color:#888;margin-top:2px">'+d.type+' · '+d.ref+'</div></div>'+
      '<span class="badge" style="background:'+ss.bg+';color:'+ss.c+'">'+d.s+'</span>'+
      '<button onclick="delDoc('+currentSup.id+','+d.id+')" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;padding:2px 0 2px 6px">🗑</button>'+
      '</div>';
  }).join('');
}

function renderStats(){
  var el=document.getElementById('tab-content-stats');
  var types=["Manuel","Catalogue","Schéma","Bulletin","Installation"];
  el.innerHTML='<div class="stat-grid">'+types.map(function(tp){
    var c=currentSup.docs.filter(function(d){return d.type===tp;}).length;
    return '<div class="stat-box"><div style="font-size:10px;color:#888">'+tp+'</div><div style="font-size:20px;font-weight:600">'+c+'</div></div>';
  }).join('')+'</div>';
}

function showAddDoc(){document.getElementById('modal-doc').style.display='flex';}
function closeModal(){document.getElementById('modal-doc').style.display='none';}
function saveDoc(){
  var t=document.getElementById('nd-title').value.trim();
  if(!t||!currentSup)return;
  var doc={id:Date.now(),t:t,type:document.getElementById('nd-type').value,ref:document.getElementById('nd-ref').value,s:document.getElementById('nd-status').value};
  currentSup.docs.push(doc);
  closeModal();
  setTab('docs');
}

function delDoc(sid,did){
  var s=SUPS.find(function(x){return x.id===sid;});
  if(s)s.docs=s.docs.filter(function(d){return d.id!==did;});
  if(currentSup&&currentSup.id===sid)currentSup=s;
  renderDocs();
}

function showSearch(){show('search');document.getElementById('search-inp').value='';doSearch();}

function doSearch(){
  var q=document.getElementById('search-inp').value.toLowerCase().trim();
  var allD=SUPS.flatMap(function(s){return s.docs.map(function(d){return Object.assign({},d,{sName:s.name,sColor:s.color,sId:s.id});});});
  var res=q?allD.filter(function(d){return d.t.toLowerCase().includes(q)||(d.ref||'').toLowerCase().includes(q)||d.sName.toLowerCase().includes(q);}):allD;
  document.getElementById('search-count').textContent=res.length+' résultat'+(res.length!==1?'s':'');
  document.getElementById('search-results').innerHTML=res.map(function(d){
    var ss=sc(d.s);
    return '<div class="doc-row" onclick="showSup('+d.sId+')" style="cursor:pointer">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-weight:500;font-size:13px">'+d.t+'</div>'+
      '<div style="font-size:10px;margin-top:2px"><span style="color:'+d.sColor+';font-weight:500">'+d.sName+'</span> · '+d.type+' · '+d.ref+'</div></div>'+
      '<span class="badge" style="background:'+ss.bg+';color:'+ss.c+'">'+d.s+'</span>'+
      '</div>';
  }).join('');
}

function toggleAgent(){
  agentOpen=!agentOpen;
  var p=document.getElementById('agent-panel');
  p.style.display=agentOpen?'flex':'none';
  document.getElementById('fab-btn').textContent=agentOpen?'✕':'🤖';
}

function initChat(){
  var fn=currentUser?currentUser.name.split(' ')[0]:'';
  var hr=new Date().getHours();
  var gr=hr<12?'Bonjour':hr<18?'Bon après-midi':'Bonsoir';
  var allD=SUPS.reduce(function(a,s){return a+s.docs.length;},0);
  chatHistory=[{role:'assistant',content:gr+' '+fn+' ! Je suis votre assistant technique Patterson.\n\nJe connais vos '+allD+' documents sur '+SUPS.length+' fournisseurs. Comment puis-je vous aider ?'}];
  renderChat();
}

function renderChat(){
  var el=document.getElementById('chat-msgs');
  el.innerHTML=chatHistory.map(function(m){
    var isUser=m.role==='user';
    return '<div style="display:flex;justify-content:'+(isUser?'flex-end':'flex-start')+'">'+
      '<div class="chat-bubble" style="background:'+(isUser?'#E6F1FB':'#f5f5f5')+';color:'+(isUser?'#0C447C':'#1a1a1a')+'">'+m.content+'</div></div>';
  }).join('');
  el.scrollTop=el.scrollHeight;
}

async function sendChat(){
  var inp=document.getElementById('chat-inp');
  var txt=inp.value.trim(); if(!txt)return;
  inp.value='';
  chatHistory.push({role:'user',content:txt});
  renderChat();
  var cat=SUPS.map(function(s){return s.name+'('+s.cat+'): '+s.docs.map(function(d){return '"'+d.t+'"['+d.type+','+d.ref+']';}).join(', ');}).join('\n');
  var sys='Tu es un assistant technique pour Patterson Dentaire Canada. Réponds en français canadien.\nBIBLIOTHÈQUE:\n'+cat+'\nTechnicien: '+(currentUser?currentUser.name:'');
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:sys,messages:chatHistory})});
    var data=await res.json();
    var reply=(data.content||[]).find(function(b){return b.type==='text';});
    chatHistory.push({role:'assistant',content:reply?reply.text:'Désolé, erreur.'});
  }catch(e){chatHistory.push({role:'assistant',content:'Erreur de connexion.'});}
  renderChat();
}
</script>
